<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💕 For MJ</title>
    <style>
        /* ---- RESET & BASE ---- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #fce4ec, #f8bbd0);
            padding: 20px;
            transition: background 0.5s ease;
            position: relative;
            overflow-x: hidden;
        }

        /* ---- ENVELOPE (initial state) ---- */
        .envelope-container {
            max-width: 550px;
            width: 100%;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .envelope-container:hover {
            transform: scale(1.02);
        }

        .envelope {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            padding: 50px 40px;
            border-radius: 40px;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.5s ease;
        }

        .envelope-emoji {
            font-size: 80px;
            display: block;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        .envelope h2 {
            color: #880e4f;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .envelope .sub {
            color: #ad1457;
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 8px;
        }

        .tap-hint {
            margin-top: 20px;
            color: #880e4f;
            font-size: 0.85rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        /* ---- LETTER (revealed state) ---- */
        .letter-container {
            display: none;
            max-width: 600px;
            width: 100%;
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .letter {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            padding: 50px 40px;
            border-radius: 40px;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
            position: relative;
        }

        .letter::before {
            content: '💌';
            position: absolute;
            top: -20px;
            left: -10px;
            font-size: 40px;
            transform: rotate(-15deg);
        }

        .letter-header {
            margin-bottom: 25px;
        }

        .letter-header .to {
            font-size: 0.9rem;
            color: #ad1457;
            opacity: 0.6;
            letter-spacing: 2px;
        }

        .letter-header h1 {
            font-size: 2rem;
            color: #880e4f;
            font-weight: 700;
        }

        /* ---- BIG BOUQUET ---- */
        .bouquet-container {
            position: relative;
            display: inline-block;
            cursor: pointer;
            margin: 20px 0 30px;
            transition: transform 0.3s ease;
        }

        .bouquet-container:hover {
            transform: scale(1.02);
        }

        .bouquet-container .bouquet-emoji {
            font-size: 200px;
            display: block;
            line-height: 1.2;
            transition: all 0.5s ease;
            user-select: none;
            animation: bouquetFloat 4s ease-in-out infinite;
        }

        @keyframes bouquetFloat {
            0%,
            100% {
                transform: translateY(0) rotate(-2deg);
            }
            50% {
                transform: translateY(-12px) rotate(2deg);
            }
        }

        .bouquet-container .bouquet-emoji.tapped {
            animation: bouquetBloom 1s ease;
        }

        @keyframes bouquetBloom {
            0% {
                transform: scale(0.7) rotate(-10deg);
            }
            40% {
                transform: scale(1.15) rotate(5deg);
            }
            70% {
                transform: scale(0.95) rotate(-3deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        /* ---- NOTE ON BOUQUET ---- */
        .note-on-bouquet {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 24px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border: 2px solid #f8bbd0;
            font-size: 1rem;
            color: #880e4f;
            font-weight: 500;
            white-space: nowrap;
            opacity: 0;
            transition: all 0.5s ease;
            pointer-events: none;
        }

        .note-on-bouquet.show {
            opacity: 1;
            animation: notePop 0.6s ease;
        }

        @keyframes notePop {
            0% {
                transform: translateX(-50%) scale(0.5);
                opacity: 0;
            }
            60% {
                transform: translateX(-50%) scale(1.1);
            }
            100% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
        }

        .note-on-bouquet .heart {
            color: #e91e63;
        }

        /* ---- MESSAGE TEXT ---- */
        .message-text {
            font-size: 1.1rem;
            color: #4a1a2c;
            line-height: 1.8;
            margin: 10px 0 20px;
            padding: 20px;
            background: rgba(248, 187, 208, 0.15);
            border-radius: 20px;
            border: 1px solid rgba(248, 187, 208, 0.3);
        }

        .message-text .big-heart {
            color: #e91e63;
            font-size: 1.3rem;
        }

        /* ---- SPARKLES ---- */
        .sparkle-burst {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-size: 30px;
            animation: sparkleBurst 1.2s ease forwards;
        }

        @keyframes sparkleBurst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.3) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(360deg);
            }
        }

        /* ---- PETALS ---- */
        .petal {
            position: fixed;
            font-size: 28px;
            pointer-events: none;
            z-index: 999;
            animation: petalFall linear forwards;
            opacity: 0.8;
        }

        @keyframes petalFall {
            0% {
                opacity: 0;
                transform: translateY(-30px) rotate(0deg) scale(0.5);
            }
            10% {
                opacity: 0.9;
            }
            100% {
                opacity: 0;
                transform: translateY(110vh) rotate(720deg) scale(1);
            }
        }

        /* ---- LETTER FOOTER ---- */
        .letter-footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(136, 14, 79, 0.1);
        }

        .letter-footer .signature {
            font-size: 1.1rem;
            color: #880e4f;
            font-weight: 600;
        }

        .letter-footer .heart-end {
            font-size: 28px;
            margin-top: 10px;
            color: #e91e63;
        }

        /* ---- EXIT BUTTON ---- */
        .exit-button-container {
            text-align: center;
            margin-top: 25px;
        }

        .exit-button {
            background: linear-gradient(135deg, #e91e63, #c2185b);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
            animation: buttonPulse 2s ease-in-out infinite;
            letter-spacing: 0.5px;
        }

        .exit-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(233, 30, 99, 0.5);
            background: linear-gradient(135deg, #f06292, #e91e63);
        }

        @keyframes buttonPulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 8px 25px rgba(233, 30, 99, 0.5);
            }
        }

        /* ---- EXIT OVERLAY ---- */
        .exit-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #fce4ec, #f8bbd0);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.8s ease;
            flex-direction: column;
        }

        .exit-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .exit-content {
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        .exit-content .big-emoji {
            font-size: 80px;
            display: block;
            margin-bottom: 20px;
        }

        .exit-content h1 {
            font-size: 2.5rem;
            color: #880e4f;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .exit-content p {
            font-size: 1.2rem;
            color: #ad1457;
            opacity: 0.8;
        }

        /* ---- HEARTS ---- */
        .heart-float {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            z-index: 999;
            animation: heartRise linear forwards;
        }

        @keyframes heartRise {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-120px) scale(0.5) rotate(40deg);
            }
        }

        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 999;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(-20px) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(110vh) rotate(720deg);
            }
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 500px) {
            .envelope {
                padding: 35px 25px;
            }
            .envelope-emoji {
                font-size: 60px;
            }
            .letter {
                padding: 30px 20px;
            }
            .letter-header h1 {
                font-size: 1.5rem;
            }
            .bouquet-container .bouquet-emoji {
                font-size: 130px;
            }
            .note-on-bouquet {
                font-size: 0.8rem;
                padding: 8px 16px;
                bottom: 5px;
            }
            .message-text {
                font-size: 0.95rem;
                padding: 15px;
            }
            .exit-button {
                padding: 12px 30px;
                font-size: 1rem;
            }
            .exit-content h1 {
                font-size: 2rem;
            }
            .exit-content .big-emoji {
                font-size: 60px;
            }
        }

        @media (max-width: 400px) {
            .bouquet-container .bouquet-emoji {
                font-size: 100px;
            }
            .note-on-bouquet {
                font-size: 0.7rem;
                padding: 6px 12px;
                bottom: 2px;
            }
            .message-text {
                font-size: 0.85rem;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ---- ENVELOPE ---- -->
    <div class="envelope-container" id="envelopeContainer">
        <div class="envelope">
            <span class="envelope-emoji">🎁</span>
            <h2>For MJ</h2>
            <p class="sub">A big bouquet just for you 💕</p>
            <p class="tap-hint">👆 tap to open</p>
        </div>
    </div>

    <!-- ---- LETTER ---- -->
    <div class="letter-container" id="letterContainer">
        <div class="letter">
            <div class="letter-header">
                <div class="to">💕 For</div>
                <h1>MJ</h1>
            </div>

            <!-- ---- BIG BOUQUET WITH NOTE ---- -->
            <div class="bouquet-container" id="bouquetContainer">
                <span class="bouquet-emoji" id="bouquetEmoji">💐</span>
                <div class="note-on-bouquet" id="noteOnBouquet">
                    <span class="heart">❤️</span> For you, always <span class="heart">❤️</span>
                </div>
            </div>

            <!-- ---- MESSAGE ---- -->
            <div class="message-text">
                <span class="big-heart">💖</span><br /><br />
                Thanks for listening to me last night...<br />
                it meant more than you know.<br /><br />
                <span class="big-heart">💕</span>
            </div>

            <div class="letter-footer">
                <div class="signature">Yours, Ron 💕</div>
                <div class="heart-end">💗</div>
            </div>

            <!-- ---- EXIT BUTTON ---- -->
            <div class="exit-button-container">
                <button class="exit-button" id="exitButton">✨ Close ✨</button>
            </div>
        </div>
    </div>

    <!-- ---- EXIT OVERLAY ---- -->
    <div class="exit-overlay" id="exitOverlay">
        <div class="exit-content">
            <span class="big-emoji">💖</span>
            <h1>You're the best, MJ!</h1>
            <p>I hope this made you smile. 💕</p>
            <p style="margin-top: 10px; font-size: 0.9rem; opacity: 0.6;">— Ron</p>
        </div>
    </div>

    <script>
        // ---- SOUND EFFECTS ENGINE ----
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.initialized = false;
            }

            init() {
                if (this.initialized) return;
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.initialized = true;
                } catch (e) {
                    console.log('Web Audio not supported');
                }
            }

            playBloomSound() {
                this.init();
                if (!this.ctx) return;

                try {
                    const notes = [523, 659, 784, 880];
                    notes.forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq + Math.random() * 50, this.ctx.currentTime + i * 0.08);
                        gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.08 + 0.3);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(this.ctx.currentTime + i * 0.08);
                        osc.stop(this.ctx.currentTime + i * 0.08 + 0.3);
                    });
                } catch (e) {
                    console.log('Sound play error:', e);
                }
            }

            playCelebrationSound() {
                this.init();
                if (!this.ctx) return;

                try {
                    const melody = [523, 587, 659, 784, 880, 988, 1047];
                    melody.forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.1);
                        gain.gain.setValueAtTime(0.15, this.ctx.currentTime + i * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.1 + 0.25);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(this.ctx.currentTime + i * 0.1);
                        osc.stop(this.ctx.currentTime + i * 0.1 + 0.25);
                    });
                } catch (e) {
                    console.log('Celebration sound error:', e);
                }
            }
        }

        const sound = new SoundEngine();

        // ---- BOUQUET INTERACTION ----
        const bouquetContainer = document.getElementById('bouquetContainer');
        const bouquetEmoji = document.getElementById('bouquetEmoji');
        const note = document.getElementById('noteOnBouquet');
        let hasBloomed = false;

        bouquetContainer.addEventListener('click', function(e) {
            // Sound
            sound.playBloomSound();

            // Animation
            bouquetEmoji.classList.remove('tapped');
            void bouquetEmoji.offsetWidth;
            bouquetEmoji.classList.add('tapped');

            // Show note
            note.classList.add('show');

            // Sparkles
            createSparkles(e);

            // Petals
            createPetals();

            if (!hasBloomed) {
                hasBloomed = true;
                // Change bouquet to a more vibrant one
                setTimeout(() => {
                    bouquetEmoji.textContent = '🌺';
                    setTimeout(() => {
                        bouquetEmoji.textContent = '💐';
                        setTimeout(() => {
                            bouquetEmoji.textContent = '🌷';
                            setTimeout(() => {
                                bouquetEmoji.textContent = '💐';
                                // Celebration!
                                sound.playCelebrationSound();
                                createCelebration();
                                showFloatingMessage('🌺 The bouquet is all for you! 💕');
                            }, 300);
                        }, 300);
                    }, 300);
                }, 500);
            }
        });

        // ---- SPARKLES ----
        function createSparkles(event) {
            const x = event.clientX;
            const y = event.clientY;
            const sparkleEmojis = ['✨', '⭐', '💫', '🌟', '🌸', '🌺'];

            for (let i = 0; i < 15; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle-burst';
                sparkle.textContent = sparkleEmojis[Math.floor(Math.random() * sparkleEmojis.length)];
                const angle = Math.random() * 2 * Math.PI;
                const distance = Math.random() * 200 + 50;
                sparkle.style.left = x + 'px';
                sparkle.style.top = y + 'px';
                sparkle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                sparkle.style.setProperty('--ty', Math.sin(angle) * distance - 100 + 'px');
                sparkle.style.fontSize = (Math.random() * 20 + 16) + 'px';
                document.body.appendChild(sparkle);

                setTimeout(() => {
                    sparkle.remove();
                }, 1400);
            }
        }

        // ---- PETALS ----
        function createPetals() {
            const petalEmojis = ['🌸', '🌺', '🌷', '🌹', '💮', '🏵️'];
            for (let i = 0; i < 12; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.className = 'petal';
                    petal.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
                    petal.style.left = (Math.random() * 90 + 5) + '%';
                    petal.style.top = '-20px';
                    petal.style.fontSize = (Math.random() * 20 + 18) + 'px';
                    petal.style.animationDuration = (Math.random() * 3 + 3) + 's';
                    petal.style.animationDelay = (Math.random() * 0.5) + 's';
                    document.body.appendChild(petal);

                    setTimeout(() => {
                        petal.remove();
                    }, 5000);
                }, i * 100);
            }
        }

        // ---- FLOATING MESSAGE ----
        function showFloatingMessage(msg) {
            const div = document.createElement('div');
            div.style.cssText = `
                position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
                background: rgba(255,255,255,0.95); padding: 14px 32px;
                border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
                font-size: 1.2rem; color: #880e4f; font-weight: 600;
                z-index: 2000; text-align: center; border: 2px solid #f8bbd0;
                animation: fadeInUp 0.5s ease; max-width: 90%;
                transition: opacity 0.5s ease;
            `;
            div.textContent = msg;
            document.body.appendChild(div);

            setTimeout(() => {
                div.style.opacity = '0';
                setTimeout(() => div.remove(), 500);
            }, 3000);
        }

        // ---- ENVELOPE REVEAL ----
        const envelopeContainer = document.getElementById('envelopeContainer');
        const letterContainer = document.getElementById('letterContainer');

        envelopeContainer.addEventListener('click', function() {
            envelopeContainer.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
            envelopeContainer.style.opacity = '0';
            envelopeContainer.style.transform = 'scale(0.95)';

            setTimeout(() => {
                envelopeContainer.style.display = 'none';
                letterContainer.style.display = 'block';
                createCelebration();
                if (window.innerWidth <= 600) {
                    document.querySelector('.letter-container').scrollIntoView({ behavior: 'smooth' });
                }
                sound.init();
            }, 600);
        });

        // ---- EXIT BUTTON ----
        const exitButton = document.getElementById('exitButton');
        const exitOverlay = document.getElementById('exitOverlay');

        exitButton.addEventListener('click', function() {
            exitOverlay.classList.add('show');
            createCelebration();
            createCelebration();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ---- CELEBRATION EFFECTS ----
        function createCelebration() {
            for (let i = 0; i < 30; i++) {
                setTimeout(() => createHeart(), i * 70);
            }
            const colors = ['#e91e63', '#f06292', '#f8bbd0', '#ff4081', '#c2185b', '#880e4f'];
            for (let i = 0; i < 60; i++) {
                setTimeout(() => createConfetti(colors), i * 50);
            }
            for (let i = 0; i < 10; i++) {
                setTimeout(() => createPetals(), i * 100);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-float';
            heart.textContent = ['💕', '❤️', '💗', '💖', '💘', '💝'][Math.floor(Math.random() * 6)];
            heart.style.left = Math.random() * 90 + 5 + '%';
            heart.style.top = Math.random() * 60 + 20 + '%';
            heart.style.fontSize = Math.random() * 18 + 16 + 'px';
            heart.style.animationDuration = Math.random() * 2 + 2 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }

        function createConfetti(colors) {
            const piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.style.left = Math.random() * 100 + '%';
            piece.style.top = '-10px';
            piece.style.background = colors[Math.floor(Math.random() * colors.length)];
            piece.style.width = Math.random() * 8 + 4 + 'px';
            piece.style.height = Math.random() * 8 + 4 + 'px';
            piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            piece.style.animationDuration = Math.random() * 2 + 2 + 's';
            piece.style.transform = `rotate(${Math.random() * 360}deg)`;
            document.body.appendChild(piece);
            setTimeout(() => piece.remove(), 4500);
        }

        // ---- BACKGROUND HEARTS ----
        setInterval(() => {
            if (letterContainer.style.display === 'block' || exitOverlay.classList.contains('show')) {
                createHeart();
            }
        }, 3000);
    </script>

</body>
</html>
