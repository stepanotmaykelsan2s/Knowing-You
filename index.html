<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💕 Gift</title>
    <style>
        /* ---- RESET & BASE ---- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #fce4ec, #f8bbd0);
            padding: 20px;
            transition: background 0.5s ease;
            position: relative;
            overflow-x: hidden;
        }

        /* ---- ENVELOPE (initial state) ---- */
        .envelope-container {
            max-width: 550px;
            width: 100%;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .envelope-container:hover {
            transform: scale(1.02);
        }

        .envelope {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            padding: 50px 40px;
            border-radius: 40px;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.5s ease;
        }

        .envelope-emoji {
            font-size: 80px;
            display: block;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        .envelope h2 {
            color: #880e4f;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .envelope .sub {
            color: #ad1457;
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 8px;
        }

        .tap-hint {
            margin-top: 20px;
            color: #880e4f;
            font-size: 0.85rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        /* ---- LETTER (revealed state) ---- */
        .letter-container {
            display: none;
            max-width: 600px;
            width: 100%;
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .letter {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            padding: 50px 40px;
            border-radius: 40px;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: left;
            position: relative;
        }

        .letter::before {
            content: '💌';
            position: absolute;
            top: -20px;
            left: -10px;
            font-size: 40px;
            transform: rotate(-15deg);
        }

        .letter-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .letter-header .to {
            font-size: 0.9rem;
            color: #ad1457;
            opacity: 0.6;
            letter-spacing: 2px;
        }

        .letter-header h1 {
            font-size: 2rem;
            color: #880e4f;
            font-weight: 700;
        }

        .letter-body {
            color: #4a1a2c;
            font-size: 1.05rem;
            line-height: 1.9;
            font-weight: 400;
            text-align: center;
        }

        .letter-body .message {
            font-size: 1.2rem;
            margin: 20px 0;
            padding: 20px;
            background: rgba(248, 187, 208, 0.2);
            border-radius: 20px;
            border: 1px solid rgba(248, 187, 208, 0.3);
        }

        .letter-body .message .heart {
            color: #e91e63;
            font-size: 1.4rem;
        }

        /* ---- VIRTUAL FLOWER ---- */
        .flower-section {
            text-align: center;
            margin: 30px 0 20px;
            padding: 25px 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .flower-section .flower-label {
            font-size: 0.9rem;
            color: #ad1457;
            opacity: 0.7;
            margin-bottom: 15px;
            display: block;
        }

        .flower-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .flower {
            font-size: 80px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            position: relative;
            display: inline-block;
        }

        .flower:hover {
            transform: scale(1.1) rotate(-10deg);
        }

        .flower.tapped {
            animation: flowerBloom 0.8s ease;
        }

        @keyframes flowerBloom {
            0% {
                transform: scale(0.5) rotate(0deg);
            }
            50% {
                transform: scale(1.3) rotate(-15deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        .flower .sparkle {
            position: absolute;
            font-size: 20px;
            pointer-events: none;
            animation: sparkleFloat 1.5s ease forwards;
        }

        @keyframes sparkleFloat {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(1.5);
            }
        }

        .flower-text {
            font-size: 0.85rem;
            color: #880e4f;
            opacity: 0.6;
            margin-top: 10px;
            transition: all 0.3s ease;
            display: block;
        }

        .flower-text.active {
            opacity: 1;
            font-weight: 600;
            color: #c2185b;
        }

        .flower-emoji {
            font-size: 60px;
            animation: flowerFloat 3s ease-in-out infinite;
            display: block;
        }

        @keyframes flowerFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        /* ---- PETALS (floating) ---- */
        .petal {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            z-index: 999;
            animation: petalFall linear forwards;
            opacity: 0.8;
        }

        @keyframes petalFall {
            0% {
                opacity: 0;
                transform: translateY(-20px) rotate(0deg) scale(0.5);
            }
            10% {
                opacity: 0.9;
            }
            100% {
                opacity: 0;
                transform: translateY(110vh) rotate(720deg) scale(1);
            }
        }

        /* ---- LETTER FOOTER ---- */
        .letter-footer {
            margin-top: 30px;
            text-align: right;
            border-top: 1px solid rgba(136, 14, 79, 0.1);
            padding-top: 25px;
        }

        .letter-footer .signature {
            font-size: 1.1rem;
            color: #880e4f;
            font-weight: 600;
        }

        .letter-footer .heart-end {
            text-align: center;
            font-size: 30px;
            margin-top: 15px;
            color: #e91e63;
        }

        /* ---- EXIT BUTTON ---- */
        .exit-button-container {
            text-align: center;
            margin-top: 30px;
        }

        .exit-button {
            background: linear-gradient(135deg, #e91e63, #c2185b);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
            animation: buttonPulse 2s ease-in-out infinite;
            letter-spacing: 0.5px;
        }

        .exit-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(233, 30, 99, 0.5);
            background: linear-gradient(135deg, #f06292, #e91e63);
        }

        @keyframes buttonPulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 8px 25px rgba(233, 30, 99, 0.5);
            }
        }

        /* ---- EXIT OVERLAY (Thank You screen) ---- */
        .exit-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #fce4ec, #f8bbd0);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.8s ease;
            flex-direction: column;
        }

        .exit-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .exit-content {
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        .exit-content .big-emoji {
            font-size: 80px;
            display: block;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .exit-content h1 {
            font-size: 2.5rem;
            color: #880e4f;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .exit-content p {
            font-size: 1.2rem;
            color: #ad1457;
            opacity: 0.8;
        }

        /* ---- FLOATING HEARTS ---- */
        .heart-float {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            z-index: 999;
            animation: heartRise linear forwards;
        }

        @keyframes heartRise {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-120px) scale(0.5) rotate(40deg);
            }
        }

        /* ---- CONFETTI ---- */
        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 999;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(-20px) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(110vh) rotate(720deg);
            }
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 500px) {
            .envelope {
                padding: 35px 25px;
            }
            .envelope-emoji {
                font-size: 60px;
            }
            .letter {
                padding: 35px 25px;
            }
            .letter-body {
                font-size: 0.95rem;
                line-height: 1.8;
            }
            .letter-header h1 {
                font-size: 1.5rem;
            }
            .letter-body .message {
                font-size: 1rem;
                padding: 15px;
            }
            .exit-button {
                padding: 12px 30px;
                font-size: 1rem;
            }
            .exit-content h1 {
                font-size: 2rem;
            }
            .exit-content .big-emoji {
                font-size: 60px;
            }
            .flower {
                font-size: 60px;
            }
            .flower-emoji {
                font-size: 45px;
            }
            .flower-container {
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- ---- ENVELOPE (click to open) ---- -->
    <div class="envelope-container" id="envelopeContainer">
        <div class="envelope">
            <span class="envelope-emoji">🎁</span>
            <h2>For MJ</h2>
            <p class="sub">A little something for you 💕</p>
            <p class="tap-hint">👆 tap to open</p>
        </div>
    </div>

    <!-- ---- LETTER (hidden initially) ---- -->
    <div class="letter-container" id="letterContainer">
        <div class="letter">
            <div class="letter-header">
                <div class="to">💕 For</div>
                <h1>MJ</h1>
            </div>

            <div class="letter-body">
                <div class="message">
                    <span class="heart">💖</span><br /><br />
                    Thanks for listening to me last night...<br />
                    it meant more than you know.<br /><br />
                    <span class="heart">💕</span>
                </div>

                <!-- ---- VIRTUAL FLOWER SECTION ---- -->
                <div class="flower-section">
                    <span class="flower-label">🌸 Tap the flowers to make them bloom!</span>
                    <div class="flower-container">
                        <div class="flower" id="flower1">
                            <span class="flower-emoji" id="flowerEmoji1">🌹</span>
                            <span class="flower-text" id="flowerText1">🌱 Tap me!</span>
                        </div>
                        <div class="flower" id="flower2">
                            <span class="flower-emoji" id="flowerEmoji2">🌸</span>
                            <span class="flower-text" id="flowerText2">🌱 Tap me!</span>
                        </div>
                        <div class="flower" id="flower3">
                            <span class="flower-emoji" id="flowerEmoji3">🌷</span>
                            <span class="flower-text" id="flowerText3">🌱 Tap me!</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="letter-footer">
                <div class="signature">Yours, Ron 💕</div>
                <div class="heart-end">💗</div>
            </div>

            <!-- ---- EXIT BUTTON ---- -->
            <div class="exit-button-container">
                <button class="exit-button" id="exitButton">✨ Close ✨</button>
            </div>
        </div>
    </div>

    <!-- ---- EXIT OVERLAY (Thank You screen) ---- -->
    <div class="exit-overlay" id="exitOverlay">
        <div class="exit-content">
            <span class="big-emoji">💖</span>
            <h1>You're the best, MJ!</h1>
            <p>I hope this made you smile. 💕</p>
            <p style="margin-top: 10px; font-size: 0.9rem; opacity: 0.6;">— Ron</p>
        </div>
    </div>

    <script>
        // ---- SOUND EFFECTS ENGINE ----
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.initialized = false;
            }

            init() {
                if (this.initialized) return;
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.initialized = true;
                } catch (e) {
                    console.log('Web Audio not supported');
                }
            }

            playBloomSound() {
                this.init();
                if (!this.ctx) return;

                try {
                    const osc1 = this.ctx.createOscillator();
                    const gain1 = this.ctx.createGain();
                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(523 + Math.random() * 100, this.ctx.currentTime);
                    gain1.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain1.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.8);
                    osc1.connect(gain1);
                    gain1.connect(this.ctx.destination);
                    osc1.start(this.ctx.currentTime);
                    osc1.stop(this.ctx.currentTime + 0.8);

                    const osc2 = this.ctx.createOscillator();
                    const gain2 = this.ctx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(659 + Math.random() * 80, this.ctx.currentTime);
                    gain2.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.7);
                    osc2.connect(gain2);
                    gain2.connect(this.ctx.destination);
                    osc2.start(this.ctx.currentTime + 0.1);
                    osc2.stop(this.ctx.currentTime + 0.8);
                } catch (e) {
                    console.log('Sound play error:', e);
                }
            }

            playSparkleSound() {
                this.init();
                if (!this.ctx) return;

                try {
                    const notes = [523, 659, 784, 1047];
                    notes.forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq + Math.random() * 50, this.ctx.currentTime + i * 0.05);
                        gain.gain.setValueAtTime(0.15, this.ctx.currentTime + i * 0.05);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.05 + 0.3);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(this.ctx.currentTime + i * 0.05);
                        osc.stop(this.ctx.currentTime + i * 0.05 + 0.3);
                    });
                } catch (e) {
                    console.log('Sparkle sound error:', e);
                }
            }

            playCelebrationSound() {
                this.init();
                if (!this.ctx) return;

                try {
                    const melody = [523, 587, 659, 784, 880, 784, 880, 1047];
                    melody.forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.12);
                        gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.12 + 0.3);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(this.ctx.currentTime + i * 0.12);
                        osc.stop(this.ctx.currentTime + i * 0.12 + 0.3);
                    });
                } catch (e) {
                    console.log('Celebration sound error:', e);
                }
            }
        }

        const sound = new SoundEngine();

        // ---- ENVELOPE REVEAL ----
        const envelopeContainer = document.getElementById('envelopeContainer');
        const letterContainer = document.getElementById('letterContainer');

        envelopeContainer.addEventListener('click', function() {
            envelopeContainer.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
            envelopeContainer.style.opacity = '0';
            envelopeContainer.style.transform = 'scale(0.95)';

            setTimeout(() => {
                envelopeContainer.style.display = 'none';
                letterContainer.style.display = 'block';
                createCelebration();
                if (window.innerWidth <= 600) {
                    document.querySelector('.letter-container').scrollIntoView({ behavior: 'smooth' });
                }
                sound.init();
            }, 600);
        });

        // ---- VIRTUAL FLOWER ----
        const flowers = [
            { id: 'flower1', emoji: 'flowerEmoji1', text: 'flowerText1', emojis: ['🌹', '🥀', '🌺'], texts: ['🌱 Tap me!', 'You made me bloom! 🌸', 'So beautiful! ✨'] },
            { id: 'flower2', emoji: 'flowerEmoji2', text: 'flowerText2', emojis: ['🌸', '🌼', '🌺'], texts: ['🌱 Tap me!', 'I bloomed for you! 💖', 'You\'re amazing! ✨'] },
            { id: 'flower3', emoji: 'flowerEmoji3', text: 'flowerText3', emojis: ['🌷', '🌻', '🌺'], texts: ['🌱 Tap me!', 'You make me smile! 😊', 'So special! 💫'] }
        ];

        let bloomCount = 0;

        flowers.forEach((flowerData) => {
            const flowerEl = document.getElementById(flowerData.id);
            const emojiEl = document.getElementById(flowerData.emoji);
            const textEl = document.getElementById(flowerData.text);
            let tapCount = 0;

            flowerEl.addEventListener('click', function(e) {
                sound.playBloomSound();
                sound.playSparkleSound();

                flowerEl.classList.remove('tapped');
                void flowerEl.offsetWidth;
                flowerEl.classList.add('tapped');

                tapCount = (tapCount + 1) % flowerData.emojis.length;
                emojiEl.textContent = flowerData.emojis[tapCount];
                textEl.textContent = flowerData.texts[tapCount];
                textEl.classList.add('active');

                createSparkles(e, flowerEl);
                createPetals();

                bloomCount++;
                if (bloomCount >= 9) {
                    setTimeout(() => {
                        sound.playCelebrationSound();
                        createCelebration();
                        showMessage('🌸 All flowers are blooming for you! 💕');
                    }, 500);
                }

                setTimeout(() => {
                    textEl.classList.remove('active');
                }, 3000);
            });
        });

        // ---- SPARKLES ----
        function createSparkles(event, element) {
            const rect = element.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            const sparkles = ['✨', '⭐', '💫', '🌟'];

            for (let i = 0; i < 6; i++) {
                const sparkle = document.createElement('span');
                sparkle.className = 'sparkle';
                sparkle.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
                sparkle.style.left = (x + (Math.random() - 0.5) * 60) + 'px';
                sparkle.style.top = (y + (Math.random() - 0.5) * 60) + 'px';
                sparkle.style.setProperty('--tx', (Math.random() - 0.5) * 150 + 'px');
                sparkle.style.setProperty('--ty', (Math.random() - 0.5) * 150 - 100 + 'px');
                sparkle.style.fontSize = (Math.random() * 20 + 12) + 'px';
                element.appendChild(sparkle);

                setTimeout(() => {
                    sparkle.remove();
                }, 1500);
            }
        }

        // ---- PETALS ----
        function createPetals() {
            const petalEmojis = ['🌸', '🌺', '🌷', '🌹', '💮', '🏵️'];
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.className = 'petal';
                    petal.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
                    petal.style.left = (Math.random() * 90 + 5) + '%';
                    petal.style.top = '-20px';
                    petal.style.fontSize = (Math.random() * 20 + 18) + 'px';
                    petal.style.animationDuration = (Math.random() * 3 + 3) + 's';
                    petal.style.animationDelay = (Math.random() * 0.5) + 's';
                    document.body.appendChild(petal);

                    setTimeout(() => {
                        petal.remove();
                    }, 5000);
                }, i * 100);
            }
        }

        // ---- MESSAGE POPUP ----
        function showMessage(msg) {
            const div = document.createElement('div');
            div.style.cssText = `
                position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
                background: rgba(255,255,255,0.95); padding: 20px 40px;
                border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
                font-size: 1.3rem; color: #880e4f; font-weight: 600;
                z-index: 2000; text-align: center; border: 2px solid #f8bbd0;
                animation: fadeIn 0.5s ease; max-width: 90%;
            `;
            div.textContent = msg;
            document.body.appendChild(div);

            setTimeout(() => {
                div.style.transition = 'opacity 0.5s ease';
                div.style.opacity = '0';
                setTimeout(() => div.remove(), 500);
            }, 3000);
        }

        // ---- EXIT BUTTON ----
        const exitButton = document.getElementById('exitButton');
        const exitOverlay = document.getElementById('exitOverlay');

        exitButton.addEventListener('click', function() {
            exitOverlay.classList.add('show');
            createCelebration();
            createCelebration();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ---- CELEBRATION EFFECTS ----
        function createCelebration() {
            for (let i = 0; i < 30; i++) {
                setTimeout(() => createHeart(), i * 100);
            }
            const colors = ['#e91e63', '#f06292', '#f8bbd0', '#ff4081', '#c2185b', '#880e4f'];
            for (let i = 0; i < 80; i++) {
                setTimeout(() => createConfetti(colors), i * 60);
            }
            for (let i = 0; i < 15; i++) {
                setTimeout(() => createPetals(), i * 150);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-float';
            heart.textContent = ['💕', '❤️', '💗', '💖', '💘', '💝'][Math.floor(Math.random() * 6)];
            heart.style.left = Math.random() * 90 + 5 + '%';
            heart.style.top = Math.random() * 60 + 20 + '%';
            heart.style.fontSize = Math.random() * 20 + 18 + 'px';
            heart.style.animationDuration = Math.random() * 2 + 2 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }

        function createConfetti(colors) {
            const piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.style.left = Math.random() * 100 + '%';
            piece.style.top = '-10px';
            piece.style.background = colors[Math.floor(Math.random() * colors.length)];
            piece.style.width = Math.random() * 8 + 4 + 'px';
            piece.style.height = Math.random() * 8 + 4 + 'px';
            piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            piece.style.animationDuration = Math.random() * 2 + 2 + 's';
            piece.style.transform = `rotate(${Math.random() * 360}deg)`;
            document.body.appendChild(piece);
            setTimeout(() => piece.remove(), 4500);
        }

        // ---- BACKGROUND HEARTS ----
        setInterval(() => {
            if (letterContainer.style.display === 'block' || exitOverlay.classList.contains('show')) {
                createHeart();
            }
        }, 3000);
    </script>

</body>
</html>
