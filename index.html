<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💕 For MJ</title>
    <style>
        /* ---- RESET & BASE ---- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #fce4ec, #f8bbd0);
            padding: 20px;
            transition: background 0.5s ease;
            position: relative;
            overflow-x: hidden;
        }

        /* ---- ENVELOPE (initial state) ---- */
        .envelope-container {
            max-width: 550px;
            width: 100%;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .envelope-container:hover {
            transform: scale(1.02);
        }

        .envelope {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            padding: 50px 40px;
            border-radius: 40px;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.5s ease;
        }

        .envelope-emoji {
            font-size: 80px;
            display: block;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        .envelope h2 {
            color: #880e4f;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .envelope .sub {
            color: #ad1457;
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 8px;
        }

        .tap-hint {
            margin-top: 20px;
            color: #880e4f;
            font-size: 0.85rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        /* ---- LETTER (revealed state) ---- */
        .letter-container {
            display: none;
            max-width: 650px;
            width: 100%;
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .letter {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            padding: 50px 40px;
            border-radius: 40px;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: left;
            position: relative;
        }

        .letter::before {
            content: '💌';
            position: absolute;
            top: -20px;
            left: -10px;
            font-size: 40px;
            transform: rotate(-15deg);
        }

        .letter-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .letter-header .to {
            font-size: 0.9rem;
            color: #ad1457;
            opacity: 0.6;
            letter-spacing: 2px;
        }

        .letter-header h1 {
            font-size: 2rem;
            color: #880e4f;
            font-weight: 700;
        }

        .letter-body {
            color: #4a1a2c;
            font-size: 1.05rem;
            line-height: 1.9;
            font-weight: 400;
            text-align: center;
        }

        .letter-body .message {
            font-size: 1.2rem;
            margin: 20px 0;
            padding: 20px;
            background: rgba(248, 187, 208, 0.2);
            border-radius: 20px;
            border: 1px solid rgba(248, 187, 208, 0.3);
        }

        .letter-body .message .heart {
            color: #e91e63;
            font-size: 1.4rem;
        }

        /* ---- BIG BOUQUET ---- */
        .flower-section {
            text-align: center;
            margin: 30px 0 20px;
            padding: 25px 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .flower-section .flower-label {
            font-size: 0.9rem;
            color: #ad1457;
            opacity: 0.7;
            margin-bottom: 15px;
            display: block;
        }

        .bouquet {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            justify-items: center;
            align-items: center;
            max-width: 500px;
            margin: 0 auto;
        }

        .flower {
            font-size: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            position: relative;
            display: inline-block;
            width: 70px;
            height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .flower:hover {
            transform: scale(1.15) rotate(-10deg);
        }

        .flower.tapped {
            animation: flowerBloom 0.8s ease;
        }

        @keyframes flowerBloom {
            0% {
                transform: scale(0.5) rotate(0deg);
            }
            50% {
                transform: scale(1.4) rotate(-15deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        .flower .sparkle {
            position: absolute;
            font-size: 18px;
            pointer-events: none;
            animation: sparkleFloat 1.5s ease forwards;
        }

        @keyframes sparkleFloat {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(1.5);
            }
        }

        .flower-emoji {
            font-size: 45px;
            animation: flowerFloat 3s ease-in-out infinite;
            display: block;
            line-height: 1;
        }

        .flower-emoji:nth-child(odd) {
            animation-delay: 0.5s;
        }
        .flower-emoji:nth-child(3n) {
            animation-delay: 1s;
        }

        @keyframes flowerFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .flower-text {
            font-size: 0.65rem;
            color: #880e4f;
            opacity: 0;
            margin-top: 4px;
            transition: all 0.3s ease;
            display: block;
            position: absolute;
            bottom: -18px;
            white-space: nowrap;
        }

        .flower-text.active {
            opacity: 1;
            font-weight: 600;
            color: #c2185b;
        }

        /* ---- PETALS (floating) ---- */
        .petal {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            z-index: 999;
            animation: petalFall linear forwards;
            opacity: 0.8;
        }

        @keyframes petalFall {
            0% {
                opacity: 0;
                transform: translateY(-20px) rotate(0deg) scale(0.5);
            }
            10% {
                opacity: 0.9;
            }
            100% {
                opacity: 0;
                transform: translateY(110vh) rotate(720deg) scale(1);
            }
        }

        /* ---- LETTER FOOTER ---- */
        .letter-footer {
            margin-top: 30px;
            text-align: right;
            border-top: 1px solid rgba(136, 14, 79, 0.1);
            padding-top: 25px;
        }

        .letter-footer .signature {
            font-size: 1.1rem;
            color: #880e4f;
            font-weight: 600;
        }

        .letter-footer .heart-end {
            text-align: center;
            font-size: 30px;
            margin-top: 15px;
            color: #e91e63;
        }

        /* ---- EXIT BUTTON ---- */
        .exit-button-container {
            text-align: center;
            margin-top: 30px;
        }

        .exit-button {
            background: linear-gradient(135deg, #e91e63, #c2185b);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
            animation: buttonPulse 2s ease-in-out infinite;
            letter-spacing: 0.5px;
        }

        .exit-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(233, 30, 99, 0.5);
            background: linear-gradient(135deg, #f06292, #e91e63);
        }

        @keyframes buttonPulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 8px 25px rgba(233, 30, 99, 0.5);
            }
        }

        /* ---- EXIT OVERLAY (Thank You screen) ---- */
        .exit-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #fce4ec, #f8bbd0);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.8s ease;
            flex-direction: column;
        }

        .exit-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .exit-content {
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        .exit-content .big-emoji {
            font-size: 80px;
            display: block;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .exit-content h1 {
            font-size: 2.5rem;
            color: #880e4f;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .exit-content p {
            font-size: 1.2rem;
            color: #ad1457;
            opacity: 0.8;
        }

        /* ---- FLOATING HEARTS ---- */
        .heart-float {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            z-index: 999;
            animation: heartRise linear forwards;
        }

        @keyframes heartRise {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-120px) scale(0.5) rotate(40deg);
            }
        }

        /* ---- CONFETTI ---- */
        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 999;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(-20px) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(110vh) rotate(720deg);
            }
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 550px) {
            .bouquet {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            .flower {
                font-size: 45px;
                width: 55px;
                height: 55px;
            }
            .flower-emoji {
                font-size: 35px;
            }
            .flower-text {
                font-size: 0.55rem;
                bottom: -16px;
            }
        }

        @media (max-width: 400px) {
            .bouquet {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .flower {
                font-size: 40px;
                width: 50px;
                height: 50px;
            }
            .flower-emoji {
                font-size: 30px;
            }
        }

        @media (max-width: 500px) {
            .envelope {
                padding: 35px 25px;
            }
            .envelope-emoji {
                font-size: 60px;
            }
            .letter {
                padding: 35px 25px;
            }
            .letter-body {
                font-size: 0.95rem;
                line-height: 1.8;
            }
            .letter-header h1 {
                font-size: 1.5rem;
            }
            .letter-body .message {
                font-size: 1rem;
                padding: 15px;
            }
            .exit-button {
                padding: 12px 30px;
                font-size: 1rem;
            }
            .exit-content h1 {
                font-size: 2rem;
            }
            .exit-content .big-emoji {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>

    <!-- ---- ENVELOPE (click to open) ---- -->
    <div class="envelope-container" id="envelopeContainer">
        <div class="envelope">
            <span class="envelope-emoji">🎁</span>
            <h2>For MJ</h2>
            <p class="sub">A big bouquet just for you 💕</p>
            <p class="tap-hint">👆 tap to open</p>
        </div>
    </div>

    <!-- ---- LETTER (hidden initially) ---- -->
    <div class="letter-container" id="letterContainer">
        <div class="letter">
            <div class="letter-header">
                <div class="to">💕 For</div>
                <h1>MJ</h1>
            </div>

            <div class="letter-body">
                <div class="message">
                    <span class="heart">💖</span><br /><br />
                    Thanks for listening to me last night...<br />
                    it meant more than you know.<br /><br />
                    <span class="heart">💕</span>
                </div>

                <!-- ---- BIG BOUQUET ---- -->
                <div class="flower-section">
                    <span class="flower-label">🌸 Tap any flower to make the whole bouquet bloom!</span>
                    <div class="bouquet" id="bouquet">
                        <!-- Flowers will be generated by JavaScript -->
                    </div>
                </div>
            </div>

            <div class="letter-footer">
                <div class="signature">Yours, Ron 💕</div>
                <div class="heart-end">💗</div>
            </div>

            <!-- ---- EXIT BUTTON ---- -->
            <div class="exit-button-container">
                <button class="exit-button" id="exitButton">✨ Close ✨</button>
            </div>
        </div>
    </div>

    <!-- ---- EXIT OVERLAY (Thank You screen) ---- -->
    <div class="exit-overlay" id="exitOverlay">
        <div class="exit-content">
            <span class="big-emoji">💖</span>
            <h1>You're the best, MJ!</h1>
            <p>I hope this made you smile. 💕</p>
            <p style="margin-top: 10px; font-size: 0.9rem; opacity: 0.6;">— Ron</p>
        </div>
    </div>

    <script>
        // ---- SOUND EFFECTS ENGINE ----
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.initialized = false;
            }

            init() {
                if (this.initialized) return;
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.initialized = true;
                } catch (e) {
                    console.log('Web Audio not supported');
                }
            }

            playBloomSound() {
                this.init();
                if (!this.ctx) return;

                try {
                    const osc1 = this.ctx.createOscillator();
                    const gain1 = this.ctx.createGain();
                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(523 + Math.random() * 100, this.ctx.currentTime);
                    gain1.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain1.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
                    osc1.connect(gain1);
                    gain1.connect(this.ctx.destination);
                    osc1.start(this.ctx.currentTime);
                    osc1.stop(this.ctx.currentTime + 0.6);

                    const osc2 = this.ctx.createOscillator();
                    const gain2 = this.ctx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(659 + Math.random() * 80, this.ctx.currentTime);
                    gain2.gain.setValueAtTime(0.18, this.ctx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                    osc2.connect(gain2);
                    gain2.connect(this.ctx.destination);
                    osc2.start(this.ctx.currentTime + 0.08);
                    osc2.stop(this.ctx.currentTime + 0.6);
                } catch (e) {
                    console.log('Sound play error:', e);
                }
            }

            playSparkleSound() {
                this.init();
                if (!this.ctx) return;

                try {
                    const notes = [523, 659, 784];
                    notes.forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq + Math.random() * 50, this.ctx.currentTime + i * 0.06);
                        gain.gain.setValueAtTime(0.12, this.ctx.currentTime + i * 0.06);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.06 + 0.25);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(this.ctx.currentTime + i * 0.06);
                        osc.stop(this.ctx.currentTime + i * 0.06 + 0.25);
                    });
                } catch (e) {
                    console.log('Sparkle sound error:', e);
                }
            }

            playCelebrationSound() {
                this.init();
                if (!this.ctx) return;

                try {
                    const melody = [523, 587, 659, 784, 880, 784, 880, 1047];
                    melody.forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.1);
                        gain.gain.setValueAtTime(0.18, this.ctx.currentTime + i * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.1 + 0.25);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(this.ctx.currentTime + i * 0.1);
                        osc.stop(this.ctx.currentTime + i * 0.1 + 0.25);
                    });
                } catch (e) {
                    console.log('Celebration sound error:', e);
                }
            }
        }

        const sound = new SoundEngine();

        // ---- GENERATE BOUQUET ----
        const flowerEmojis = ['🌹', '🌸', '🌷', '🌻', '🌺', '💐', '🌼', '🏵️', '🌸', '🌹', '🌷', '🌺', '🌻', '🌸', '🌷', '🌹'];
        const bouquet = document.getElementById('bouquet');

        flowerEmojis.forEach((emoji, index) => {
            const flower = document.createElement('div');
            flower.className = 'flower';
            flower.dataset.index = index;

            const emojiSpan = document.createElement('span');
            emojiSpan.className = 'flower-emoji';
            emojiSpan.textContent = emoji;

            const textSpan = document.createElement('span');
            textSpan.className = 'flower-text';
            textSpan.textContent = '🌱';

            flower.appendChild(emojiSpan);
            flower.appendChild(textSpan);
            bouquet.appendChild(flower);
        });

        // ---- FLOWER INTERACTION ----
        const flowers = document.querySelectorAll('.flower');
        let bloomedCount = 0;
        const totalFlowers = flowers.length;
        const bloomMessages = [
            '🌸 A flower blooms!',
            '🌺 Another one!',
            '🌷 So beautiful!',
            '🌻 Keep going!',
            '🌼 Almost there!',
            '💐 So many flowers!',
            '✨ You\'re making them bloom!',
            '💕 Beautiful!',
            '🌹 So lovely!',
            '🌸 The bouquet is growing!'
        ];

        flowers.forEach((flower, index) => {
            flower.addEventListener('click', function(e) {
                // Sound effects
                sound.playBloomSound();
                sound.playSparkleSound();

                // Animation
                this.classList.remove('tapped');
                void this.offsetWidth;
                this.classList.add('tapped');

                // Change text
                const text = this.querySelector('.flower-text');
                text.textContent = '🌸';
                text.classList.add('active');

                // Sparkles
                createSparkles(e, this);

                // Count bloomed
                if (!this.dataset.bloomed) {
                    this.dataset.bloomed = 'true';
                    bloomedCount++;

                    // Show message
                    const msg = bloomMessages[Math.min(bloomedCount - 1, bloomMessages.length - 1)];
                    showFloatingMessage(msg);

                    // Check if all bloomed
                    if (bloomedCount === totalFlowers) {
                        setTimeout(() => {
                            sound.playCelebrationSound();
                            createCelebration();
                            showFloatingMessage('💐 The whole bouquet is blooming for you! 💕');
                        }, 500);
                    }
                }

                // Petals
                createPetals();

                setTimeout(() => {
                    text.classList.remove('active');
                }, 2500);
            });
        });

        // ---- SPARKLES ----
        function createSparkles(event, element) {
            const rect = element.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            const sparkleEmojis = ['✨', '⭐', '💫', '🌟'];

            for (let i = 0; i < 5; i++) {
                const sparkle = document.createElement('span');
                sparkle.className = 'sparkle';
                sparkle.textContent = sparkleEmojis[Math.floor(Math.random() * sparkleEmojis.length)];
                sparkle.style.left = (x + (Math.random() - 0.5) * 50) + 'px';
                sparkle.style.top = (y + (Math.random() - 0.5) * 50) + 'px';
                sparkle.style.setProperty('--tx', (Math.random() - 0.5) * 120 + 'px');
                sparkle.style.setProperty('--ty', (Math.random() - 0.5) * 120 - 80 + 'px');
                sparkle.style.fontSize = (Math.random() * 16 + 10) + 'px';
                element.appendChild(sparkle);

                setTimeout(() => {
                    sparkle.remove();
                }, 1400);
            }
        }

        // ---- FLOATING MESSAGE ----
        function showFloatingMessage(msg) {
            const div = document.createElement('div');
            div.style.cssText = `
                position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
                background: rgba(255,255,255,0.95); padding: 12px 30px;
                border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
                font-size: 1.1rem; color: #880e4f; font-weight: 600;
                z-index: 2000; text-align: center; border: 2px solid #f8bbd0;
                animation: fadeInUp 0.5s ease; max-width: 90%;
                transition: opacity 0.5s ease;
            `;
            div.textContent = msg;
            document.body.appendChild(div);

            setTimeout(() => {
                div.style.opacity = '0';
                setTimeout(() => div.remove(), 500);
            }, 2500);
        }

        // ---- PETALS ----
        function createPetals() {
            const petalEmojis = ['🌸', '🌺', '🌷', '🌹', '💮', '🏵️'];
            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.className = 'petal';
                    petal.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
                    petal.style.left = (Math.random() * 90 + 5) + '%';
                    petal.style.top = '-20px';
                    petal.style.fontSize = (Math.random() * 18 + 16) + 'px';
                    petal.style.animationDuration = (Math.random() * 3 + 3) + 's';
                    petal.style.animationDelay = (Math.random() * 0.5) + 's';
                    document.body.appendChild(petal);

                    setTimeout(() => {
                        petal.remove();
                    }, 5000);
                }, i * 80);
            }
        }

        // ---- ENVELOPE REVEAL ----
        const envelopeContainer = document.getElementById('envelopeContainer');
        const letterContainer = document.getElementById('letterContainer');

        envelopeContainer.addEventListener('click', function() {
            envelopeContainer.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
            envelopeContainer.style.opacity = '0';
            envelopeContainer.style.transform = 'scale(0.95)';

            setTimeout(() => {
                envelopeContainer.style.display = 'none';
                letterContainer.style.display = 'block';
                createCelebration();
                if (window.innerWidth <= 600) {
                    document.querySelector('.letter-container').scrollIntoView({ behavior: 'smooth' });
                }
                sound.init();
            }, 600);
        });

        // ---- EXIT BUTTON ----
        const exitButton = document.getElementById('exitButton');
        const exitOverlay = document.getElementById('exitOverlay');

        exitButton.addEventListener('click', function() {
            exitOverlay.classList.add('show');
            createCelebration();
            createCelebration();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ---- CELEBRATION EFFECTS ----
        function createCelebration() {
            for (let i = 0; i < 25; i++) {
                setTimeout(() => createHeart(), i * 80);
            }
            const colors = ['#e91e63', '#f06292', '#f8bbd0', '#ff4081', '#c2185b', '#880e4f'];
            for (let i = 0; i < 60; i++) {
                setTimeout(() => createConfetti(colors), i * 50);
            }
            for (let i = 0; i < 12; i++) {
                setTimeout(() => createPetals(), i * 120);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-float';
            heart.textContent = ['💕', '❤️', '💗', '💖', '💘', '💝'][Math.floor(Math.random() * 6)];
            heart.style.left = Math.random() * 90 + 5 + '%';
            heart.style.top = Math.random() * 60 + 20 + '%';
            heart.style.fontSize = Math.random() * 18 + 16 + 'px';
            heart.style.animationDuration = Math.random() * 2 + 2 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }

        function createConfetti(colors) {
            const piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.style.left = Math.random() * 100 + '%';
            piece.style.top = '-10px';
            piece.style.background = colors[Math.floor(Math.random() * colors.length)];
            piece.style.width = Math.random() * 8 + 4 + 'px';
            piece.style.height = Math.random() * 8 + 4 + 'px';
            piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            piece.style.animationDuration = Math.random() * 2 + 2 + 's';
            piece.style.transform = `rotate(${Math.random() * 360}deg)`;
            document.body.appendChild(piece);
            setTimeout(() => piece.remove(), 4500);
        }

        // ---- BACKGROUND HEARTS ----
        setInterval(() => {
            if (letterContainer.style.display === 'block' || exitOverlay.classList.contains('show')) {
                createHeart();
            }
        }, 3000);
    </script>

</body>
</html>
